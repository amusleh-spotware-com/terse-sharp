name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build, verify and publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve the tag being released
        id: target
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TerseSharp.slnx -c Release

      - name: Test
        run: dotnet test TerseSharp.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/TerseSharp.Server/TerseSharp.Server.csproj --no-build -c Release -o artifacts/nupkg

      - name: Show resolved version
        run: ls -1 artifacts/nupkg

      - name: Smoke test the packaged tool
        run: |
          dotnet tool install -g TerseSharp --add-source artifacts/nupkg --prerelease
          export PATH="$PATH:$HOME/.dotnet/tools"
          terse --version
          cd fixtures/FixtureSolution
          terse doctor

      - name: NuGet login via trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: AlgoDeveloper

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          files: artifacts/nupkg/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.target.outputs.tag, '-') }}
