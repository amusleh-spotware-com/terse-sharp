name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build, verify and publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve the tag being released
        id: target
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TerseSharp.slnx -c Release

      - name: Test
        run: dotnet test TerseSharp.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/TerseSharp.Server/TerseSharp.Server.csproj -c Release -o artifacts/nupkg -p:TerseRidPackages=true

      - name: Show resolved version
        run: ls -1 artifacts/nupkg

      - name: Verify the RID package set
        run: |
          set -euo pipefail
          cd artifacts/nupkg
          ls TerseSharp.[0-9]*.nupkg
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64 any; do
            ls TerseSharp.$rid.*.nupkg
          done
          test "$(ls -1 *.nupkg | wc -l)" -eq 8
          precompiled=$(unzip -l TerseSharp.linux-x64.*.nupkg | awk '$NF ~ /\/Microsoft\.CodeAnalysis\.dll$/ {print $1}')
          portable=$(unzip -l TerseSharp.any.*.nupkg | awk '$NF ~ /\/Microsoft\.CodeAnalysis\.dll$/ {print $1}')
          test "$precompiled" -gt "$portable"

      - name: Smoke test the packaged tool
        run: |
          dotnet tool install -g TerseSharp --add-source artifacts/nupkg --prerelease
          export PATH="$PATH:$HOME/.dotnet/tools"
          terse --version
          find "$HOME/.dotnet/tools/.store" -ipath '*linux-x64*' -name terse.dll | grep -q .
          cd fixtures/FixtureSolution
          terse doctor

      - name: NuGet login via trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: AlgoDeveloper

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64 any; do
            dotnet nuget push artifacts/nupkg/TerseSharp.$rid.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push artifacts/nupkg/TerseSharp.[0-9]*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          files: artifacts/nupkg/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.target.outputs.tag, '-') }}
