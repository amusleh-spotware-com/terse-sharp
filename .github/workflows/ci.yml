name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TerseSharp.slnx

      - name: Build
        run: dotnet build TerseSharp.slnx --no-restore -c Release

      - name: Test
        run: dotnet test TerseSharp.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Verify formatting and analyzers
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet format analyzers TerseSharp.slnx --verify-no-changes --severity info
          dotnet format style TerseSharp.slnx --verify-no-changes --severity info

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/TerseSharp.Server/TerseSharp.Server.csproj -c Release -o artifacts/nupkg -p:TerseRidPackages=true

      - name: Verify the RID package set
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cd artifacts/nupkg
          ls TerseSharp.[0-9]*.nupkg
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64 any; do
            ls TerseSharp.$rid.*.nupkg
          done
          test "$(ls -1 *.nupkg | wc -l)" -eq 8
          precompiled=$(unzip -l TerseSharp.linux-x64.*.nupkg | awk '$NF ~ /\/Microsoft\.CodeAnalysis\.dll$/ {print $1}')
          portable=$(unzip -l TerseSharp.any.*.nupkg | awk '$NF ~ /\/Microsoft\.CodeAnalysis\.dll$/ {print $1}')
          test "$precompiled" -gt "$portable"
          dotnet tool install --tool-path "$RUNNER_TEMP/terse" TerseSharp --add-source . --prerelease
          "$RUNNER_TEMP/terse/terse" --version
          find "$RUNNER_TEMP/terse/.store" -ipath '*linux-x64*' -name terse.dll | grep -q .

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
