version: 2

updates:
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      roslyn:
        patterns: ['Microsoft.CodeAnalysis*', 'Microsoft.Build*']
      test:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
